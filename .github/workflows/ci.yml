name: Lint & Test

on:
  workflow_dispatch:
  push:
    branches: [ main, "feat/reimpl-pion*" ]
  pull_request:
    branches: [ main, "feat/reimpl-pion*" ]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.head_ref || github.sha }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with .clusterfuzzlite/build.sh.
  nightly: nightly-2026-07-07

jobs:
  lint:
    name: rust format & clippy
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    # rustfmt.toml uses unstable options; clippy stays on stable so new
    # nightly lints do not break the build.
    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy

    - name: Setup nightly rustfmt
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ env.nightly }}
        components: rustfmt

    - uses: Swatinem/rust-cache@v2
      with:
        workspaces: |
          .
          rust/fuzz
          rust/tools/lz4-matrix

    - name: Format check
      run: |
        cargo +${{ env.nightly }} fmt --all --check
        cargo +${{ env.nightly }} fmt --manifest-path rust/fuzz/Cargo.toml --check
        cargo +${{ env.nightly }} fmt --manifest-path rust/tools/lz4-matrix/Cargo.toml --check

    - name: Clippy
      run: cargo +stable clippy --workspace --all-targets -- -D warnings

    - name: Lint fuzz targets and tools
      run: |
        RUSTFLAGS="--cfg fuzzing" cargo +stable clippy --manifest-path rust/fuzz/Cargo.toml --all-targets -- -D warnings
        cargo +stable clippy --manifest-path rust/tools/lz4-matrix/Cargo.toml -- -D warnings

  test:
    name: rust test
    runs-on: ubuntu-latest
    env:
      RUSTFLAGS: -D warnings
      # Debug build keeps overflow checks; widen the seeded C comparison.
      LZ4_SWEEP_ITERS: "3000"
    steps:
    - uses: actions/checkout@v4

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable

    - uses: Swatinem/rust-cache@v2

    - name: Test
      run: cargo test --workspace

  pion:
    name: pion fmt, check & test
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Resolve pion commit
      id: pion_rev
      run: |
        rev=$(git ls-remote https://github.com/AFK-surf/pion.git refs/heads/main | awk '{print $1}')
        echo "rev=$rev" >> "$GITHUB_OUTPUT"

    - name: Cache Pion toolchain
      id: pion_cache
      uses: actions/cache@v4
      with:
        path: ~/.pion
        key: pion-toolchain-linux-x86_64-${{ steps.pion_rev.outputs.rev }}

    - name: Bootstrap Pion toolchain
      if: steps.pion_cache.outputs.cache-hit != 'true'
      run: |
        git clone --depth 1 https://github.com/AFK-surf/pion.git /tmp/pion-src
        cd /tmp/pion-src
        sh scripts/install.sh --prefix "$HOME/.pion" || sh scripts/install.sh --no-bootstrap --prefix "$HOME/.pion"

    - name: Pion fmt, check, and test
      run: |
        export PATH="$HOME/.pion/bin:$PATH"
        pionc --version
        pionc fmt --check pion
        pionc check --json pion
        pionc test --json pion
