[package]
name = "precomp2"
version = "0.1.0"
authors = ["DarkSky <darksky2048@gmail.com>"]
license = "Apache-2.0"
repository = "https://github.com/darkskygit/precomp2"
edition = "2024"

[dependencies]
base64 = "0.22"
bzip2 = "0.6"
crc32fast = "1.5"
flate2 = "1.1"
lepton_jpeg = "0.5"
memchr = "2.8"
nom = "7.1"
preflate-rs = "0.7"
thiserror = "2.0"
tokio = { version = "1.52", features = [
    "macros",
    "rt-multi-thread",
    "fs",
    "io-util",
    "net",
    "sync",
] }
webp = "0.3"

[dev-dependencies]
jpeg-encoder = "0.7"
